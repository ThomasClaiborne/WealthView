<div class="container-fluid py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0">Bank Accounts</h2>
    <button class="btn btn-outline-secondary btn-sm" (click)="showAddForm = !showAddForm">
      {{ showAddForm ? 'Cancel' : '+ Add Account' }}
    </button>
  </div>

  <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>
  <div *ngIf="successMessage" class="alert alert-success">{{ successMessage }}</div>

  <!-- Add Account Form -->
  <div *ngIf="showAddForm" class="card mb-4" style="max-width: 400px;">
    <div class="card-body">
      <h5 class="card-title mb-3">New Bank Account</h5>

      <label class="form-label">Bank</label>
      <select class="form-select mb-3" [(ngModel)]="newBankName">
        <option *ngFor="let b of banks" [value]="b">{{ bankLabel(b) }}</option>
      </select>

      <label class="form-label">Nickname <span class="text-muted">(optional)</span></label>
      <input type="text" class="form-control mb-3" [(ngModel)]="newNickname" placeholder="e.g. Personal Checking" />

      <label class="form-label">Starting Balance</label>
      <input type="number" class="form-control mb-3" [(ngModel)]="newBalance" min="0" step="0.01" />

      <button class="btn btn-primary w-100" [disabled]="loading" (click)="submitAdd()">
        {{ loading ? 'Adding...' : 'Add Account' }}
      </button>
    </div>
  </div>

  <!-- Account Cards -->
  <div *ngFor="let a of accounts" class="mb-3">
    <div class="d-flex align-items-center gap-3">

      <!-- Bank Card -->
      <div class="rounded p-3" style="width: 260px; flex-shrink: 0;"
           [style.background-color]="bankColor(a.bankName)">
        <div class="fw-semibold">{{ bankLabel(a.bankName) }}</div>
        <div class="text-muted small mb-1">{{ a.nickname ?? '—' }}</div>
        <div class="fs-5 fw-bold">${{ a.balance | number:'1.2-2' }}</div>
      </div>

      <!-- Actions -->
      <div class="d-flex gap-2 align-items-center">
        <button class="btn btn-outline-secondary btn-sm"
                (click)="openAdjust(a.bankAccountId, 'deposit')">
          Add Funds
        </button>
        <button class="btn btn-outline-secondary btn-sm"
                (click)="openAdjust(a.bankAccountId, 'withdraw')">
          Remove Funds
        </button>
        <button class="btn btn-outline-danger btn-sm"
                (click)="deactivate(a.bankAccountId)">
          Delete
        </button>
      </div>
    </div>

    <!-- Inline Adjust Form -->
    <div *ngIf="selectedId === a.bankAccountId" class="mt-2" style="max-width: 400px;">
      <div class="card">
        <div class="card-body py-2">
          <label class="form-label mb-1">
            {{ adjustMode === 'deposit' ? 'Add Funds' : 'Remove Funds' }} — Amount
          </label>
          <div class="d-flex gap-2">
            <input type="number" class="form-control form-control-sm"
                   [(ngModel)]="adjustAmount" min="0.01" step="0.01" />
            <button class="btn btn-sm btn-primary" [disabled]="loading" (click)="submitAdjust()">
              Confirm
            </button>
            <button class="btn btn-sm btn-outline-secondary" (click)="selectedId = null">
              Cancel
            </button>
          </div>
        </div>
      </div>
    </div>

    <hr class="my-3" />
  </div>

  <div *ngIf="accounts.length === 0 && !errorMessage" class="text-muted">
    No bank accounts yet. Add one above.
  </div>
</div>
